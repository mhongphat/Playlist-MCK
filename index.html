<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#030303">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="HVL — Album Visual Experience · MCK">
<title>HVL — Album Visual Experience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap');

:root {
  --bg: #030303;
  --surface: #0a0909;
  --surface2: #121010;
  --wine: #2a060c;
  --wine2: #4a0c16;
  --red: #c41e36;
  --red2: #e83a52;
  --gold: #c9a87c;
  --gold2: #e8d0a8;
  --cream: #f5ece3;
  --cream2: #ddd0c2;
  --muted: #6e6660;
  --line: rgba(245,236,227,.07);
  --glow: rgba(196,30,54,.4);
  --glow-gold: rgba(201,168,124,.25);
  --radius: 26px;
  --radius-sm: 14px;
  --ease: cubic-bezier(.22,.68,0,1.2);
  --ease-out: cubic-bezier(.16,1,.3,1);
  --safe-b: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-font-smoothing: antialiased; margin: 0; padding: 0; }
html, body { min-height: 100%; background: var(--bg); color: var(--cream); font-family: "Be Vietnam Pro", system-ui, sans-serif; }
body {
  background:
    radial-gradient(1100px 750px at 0% -20%, rgba(196,30,54,.2), transparent 48%),
    radial-gradient(900px 600px at 100% 120%, rgba(42,6,12,.5), transparent 48%),
    radial-gradient(500px 400px at 70% 20%, rgba(201,168,124,.04), transparent 50%),
    #030303;
  overflow-x: hidden;
}

button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; -webkit-tap-highlight-color: transparent; }
button:disabled { opacity: .4; cursor: not-allowed; }

.app {
  width: min(1460px, 100%);
  margin: 0 auto;
  padding: 22px 22px calc(14px + var(--safe-b));
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

/* ── Header ── */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  animation: fadeDown .65s var(--ease-out) both;
}
@keyframes fadeDown {
  from { opacity: 0; transform: translateY(-14px); }
  to { opacity: 1; transform: none; }
}
.identity { display: flex; align-items: center; gap: 14px; }
.logo {
  width: 50px; height: 50px; border-radius: 16px;
  display: grid; place-items: center;
  font-size: 12px; font-weight: 800; letter-spacing: .18em;
  background: linear-gradient(145deg, var(--red2) 0%, var(--wine2) 50%, var(--wine) 100%);
  box-shadow:
    0 12px 40px var(--glow),
    inset 0 1px 0 rgba(255,255,255,.15),
    inset 0 -1px 0 rgba(0,0,0,.3);
  transition: transform .45s var(--ease), box-shadow .45s;
  position: relative;
}
.logo::after {
  content: '';
  position: absolute; inset: -2px;
  border-radius: 18px;
  background: linear-gradient(145deg, rgba(232,58,82,.4), transparent 60%);
  z-index: -1;
  opacity: 0;
  transition: opacity .4s;
}
.logo:hover { transform: scale(1.07) rotate(-3deg); box-shadow: 0 16px 48px var(--glow); }
.logo:hover::after { opacity: 1; }
.brand {
  font: 600 27px/1.05 "Cormorant Garamond", Georgia, serif;
  letter-spacing: -.015em;
  background: linear-gradient(90deg, var(--cream) 0%, var(--gold2) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.eyebrow {
  font-size: 9px; color: var(--muted);
  letter-spacing: .26em; margin-top: 5px; text-transform: uppercase;
  font-weight: 500;
}
.live {
  display: flex; align-items: center; gap: 9px;
  font-size: 9px; letter-spacing: .2em; color: #a8988e;
  padding: 7px 14px;
  border-radius: 99px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.02);
}
.live-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--red2);
  box-shadow: 0 0 10px var(--red2), 0 0 20px rgba(232,58,82,.4);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: .4; transform: scale(.75); }
}

/* ── Layout ── */
.layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 390px;
  gap: 18px;
  flex: 1;
  animation: fadeUp .75s .08s var(--ease-out) both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: none; }
}

.card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  background:
    linear-gradient(165deg, rgba(22,17,17,.97) 0%, rgba(8,6,6,.99) 100%);
  box-shadow:
    0 32px 90px rgba(0,0,0,.6),
    inset 0 1px 0 rgba(255,255,255,.04),
    inset 0 0 0 1px rgba(201,168,124,.03);
  backdrop-filter: blur(24px);
  position: relative;
}
.card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(201,168,124,.15), transparent);
  pointer-events: none; z-index: 2;
}

/* ── Visual / Video ── */
.visual {
  position: relative;
  aspect-ratio: 16/9;
  background: #000;
  overflow: hidden;
}
.visual video {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: contain; background: #000;
  transition: opacity .55s var(--ease-out), filter .55s;
}
.visual.loading video { opacity: .25; filter: blur(2px); }
.visual.switching video { opacity: 0; filter: blur(4px); }

.shade {
  position: absolute; inset: 0; pointer-events: none;
  background:
    linear-gradient(180deg, rgba(0,0,0,.35) 0%, transparent 22%, transparent 50%, rgba(0,0,0,.88) 100%),
    radial-gradient(ellipse at 50% 100%, rgba(42,6,12,.3), transparent 60%);
}
.badge {
  position: absolute; z-index: 4; top: 14px; left: 14px;
  padding: 7px 14px; border-radius: 99px;
  font-size: 8px; letter-spacing: .18em; color: var(--gold2);
  border: 1px solid rgba(201,168,124,.2);
  background: rgba(0,0,0,.55);
  backdrop-filter: blur(14px);
  pointer-events: none;
  text-transform: uppercase;
}
.corner {
  position: absolute; z-index: 4; right: 14px; bottom: 14px;
  font-size: 8px; letter-spacing: .16em; color: rgba(255,255,255,.28);
  pointer-events: none;
}

.loader {
  position: absolute; inset: 0; z-index: 6;
  display: grid; place-items: center;
  background: rgba(0,0,0,.55);
  opacity: 0; pointer-events: none; transition: opacity .35s;
}
.visual.loading .loader, .visual.switching .loader { opacity: 1; }
.spinner {
  width: 42px; height: 42px;
  border: 2px solid rgba(245,236,227,.1);
  border-top-color: var(--red2);
  border-right-color: var(--gold);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Subtitle */
.subtitle {
  position: absolute; z-index: 5;
  left: 50%; bottom: 90px;
  transform: translateX(-50%);
  width: min(94%, 840px);
  padding: 12px 22px;
  border-radius: 14px;
  text-align: center;
  background: rgba(0,0,0,.8);
  border: 1px solid rgba(245,236,227,.06);
  font-size: clamp(15px, 1.7vw, 22px);
  font-weight: 600;
  line-height: 1.45;
  letter-spacing: .01em;
  opacity: 0;
  transition: opacity .35s;
  pointer-events: none;
  text-shadow: 0 2px 14px rgba(0,0,0,.75);
  backdrop-filter: blur(10px);
}
.subtitle.show { opacity: 1; }

.buffer-bar {
  position: absolute; left: 0; right: 0; bottom: 0; height: 2px; z-index: 4;
  background: rgba(255,255,255,.05); pointer-events: none;
}
.buffer-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--wine2), var(--red2), var(--gold));
  transition: width .2s linear;
  box-shadow: 0 0 8px var(--glow);
}

/* Controls overlay */
.controls-overlay {
  position: absolute; z-index: 7; left: 0; right: 0; bottom: 0;
  padding: 58px 16px 13px;
  background: linear-gradient(180deg, transparent, rgba(0,0,0,.95));
  opacity: 0; transform: translateY(8px);
  transition: opacity .3s, transform .3s var(--ease-out);
}
.visual:hover .controls-overlay,
.visual.show-controls .controls-overlay { opacity: 1; transform: none; }
@media (hover: none) { .controls-overlay { opacity: 1; transform: none; } }

.progress {
  width: 100%; height: 4px; appearance: none; border-radius: 99px; cursor: pointer;
  background: linear-gradient(90deg, var(--red2) 0, var(--red2) var(--p,0%), rgba(255,255,255,.12) var(--p,0%), rgba(255,255,255,.12) 100%);
}
.progress::-webkit-slider-thumb {
  appearance: none; width: 14px; height: 14px; border-radius: 50%;
  background: linear-gradient(145deg, var(--cream), var(--gold2));
  box-shadow: 0 0 14px var(--glow), 0 2px 6px rgba(0,0,0,.4);
}
.progress::-moz-range-thumb {
  width: 14px; height: 14px; border-radius: 50%;
  background: linear-gradient(145deg, var(--cream), var(--gold2)); border: 0;
}

.video-row { display: flex; align-items: center; gap: 6px; margin-top: 11px; }
.vbtn {
  width: 34px; height: 32px; border-radius: 10px;
  display: grid; place-items: center;
  border: 1px solid rgba(245,236,227,.08);
  background: rgba(8,6,6,.6); color: var(--cream);
  transition: all .22s var(--ease);
}
.vbtn:hover, .vbtn.active {
  background: rgba(196,30,54,.28);
  border-color: rgba(232,58,82,.4);
  box-shadow: 0 0 16px rgba(196,30,54,.2);
}
.vbtn:active { transform: scale(.92); }
.vbtn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.mini-play svg { fill: currentColor; stroke: none; }
.vol { width: 62px; height: 3px; accent-color: var(--red2); }
.time { font-size: 10px; color: rgba(245,236,227,.6); white-space: nowrap; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.spacer { flex: 1; }

/* Now playing */
.now {
  padding: 16px 22px 8px;
  display: flex; justify-content: space-between; align-items: flex-end; gap: 14px;
}
.title {
  font: 600 clamp(20px, 2.2vw, 28px)/1.15 "Cormorant Garamond", Georgia, serif;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: opacity .35s, transform .35s var(--ease-out);
}
.title.fade { opacity: 0; transform: translateY(6px); }
.meta {
  font-size: 11px; color: var(--muted); margin-top: 5px;
  letter-spacing: .03em;
  transition: opacity .35s;
}
.meta.fade { opacity: 0; }
.number {
  font: 600 28px "Cormorant Garamond", Georgia, serif;
  color: rgba(245,236,227,.14);
  font-variant-numeric: tabular-nums;
  transition: opacity .35s;
}
.number.fade { opacity: 0; }

/* ── Luxury main controls ── */
.main-controls {
  padding: 12px 20px 18px;
  border-top: 1px solid rgba(245,236,227,.04);
}
.actions { display: flex; justify-content: center; align-items: center; gap: 14px; }

.round {
  width: 46px; height: 46px; border-radius: 50%;
  display: grid; place-items: center;
  border: 1px solid rgba(245,236,227,.09);
  background:
    linear-gradient(160deg, rgba(255,255,255,.04) 0%, rgba(255,255,255,.01) 100%);
  color: var(--cream);
  box-shadow:
    0 4px 16px rgba(0,0,0,.3),
    inset 0 1px 0 rgba(255,255,255,.06);
  transition: all .28s var(--ease);
  position: relative;
}
.round::before {
  content: '';
  position: absolute; inset: -1px;
  border-radius: 50%;
  background: linear-gradient(145deg, rgba(201,168,124,.2), transparent 50%, rgba(196,30,54,.15));
  opacity: 0;
  transition: opacity .3s;
  z-index: -1;
}
.round:hover {
  background: linear-gradient(160deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
  border-color: rgba(201,168,124,.25);
  transform: scale(1.1);
  box-shadow: 0 6px 24px rgba(0,0,0,.35), 0 0 20px rgba(201,168,124,.08);
}
.round:hover::before { opacity: 1; }
.round:active { transform: scale(.93); }
.round svg {
  width: 17px; height: 17px;
  fill: none; stroke: currentColor;
  stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
}
.round.active {
  background: linear-gradient(145deg, rgba(196,30,54,.4), rgba(74,12,22,.5));
  border-color: rgba(232,58,82,.5);
  box-shadow: 0 4px 20px rgba(196,30,54,.3), inset 0 1px 0 rgba(255,255,255,.08);
  color: var(--gold2);
}

/* Play button — hero luxury */
.round.play {
  width: 64px; height: 64px;
  background: linear-gradient(145deg, #f0455c 0%, #c41e36 40%, #6a1020 100%);
  border: 0;
  box-shadow:
    0 14px 40px rgba(196,30,54,.45),
    0 0 0 1px rgba(255,255,255,.08) inset,
    0 1px 0 rgba(255,255,255,.2) inset,
    0 -2px 0 rgba(0,0,0,.2) inset;
}
.round.play::before {
  inset: -3px;
  background: linear-gradient(145deg, rgba(232,58,82,.5), rgba(201,168,124,.15), transparent);
  opacity: .6;
}
.round.play:hover {
  transform: scale(1.1);
  box-shadow:
    0 18px 50px rgba(196,30,54,.55),
    0 0 0 1px rgba(255,255,255,.1) inset,
    0 1px 0 rgba(255,255,255,.25) inset;
}
.round.play:hover::before { opacity: 1; }
.round.play svg { width: 22px; height: 22px; fill: currentColor; stroke: none; filter: drop-shadow(0 1px 2px rgba(0,0,0,.3)); }

.hint {
  text-align: center; margin-top: 10px;
  color: rgba(245,236,227,.28);
  font-size: 9px; letter-spacing: .12em;
}

/* ── Side playlist ── */
.side {
  padding: 16px;
  display: flex; flex-direction: column;
  max-height: calc(100dvh - 110px);
}
.side-head { display: flex; justify-content: space-between; align-items: center; }
.side-title {
  font: 600 21px "Cormorant Garamond", Georgia, serif;
  background: linear-gradient(90deg, var(--cream), var(--gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.count {
  font-size: 9px; letter-spacing: .16em; color: var(--muted);
  padding: 4px 10px; border-radius: 99px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.02);
}

.search {
  height: 42px; margin: 12px 0 10px; padding: 0 14px;
  border-radius: 13px; border: 1px solid var(--line);
  display: flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,.02);
  transition: all .25s;
}
.search:focus-within {
  border-color: rgba(201,168,124,.3);
  background: rgba(201,168,124,.04);
  box-shadow: 0 0 20px rgba(201,168,124,.06);
}
.search input {
  width: 100%; border: 0; outline: 0; background: transparent;
  color: var(--cream); font-size: 13px;
}
.search input::placeholder { color: var(--muted); }

.playlist {
  overflow: auto; flex: 1;
  padding-right: 3px;
  scrollbar-width: thin;
  scrollbar-color: rgba(196,30,54,.25) transparent;
}
.playlist::-webkit-scrollbar { width: 4px; }
.playlist::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, var(--red2), var(--wine2));
  border-radius: 99px;
}

.item {
  display: grid;
  grid-template-columns: 34px minmax(0,1fr) 16px;
  gap: 8px; align-items: center;
  padding: 11px 11px; margin: 2px 0;
  border-radius: 13px; cursor: pointer;
  transition: all .22s var(--ease);
  text-align: left; width: 100%;
  border: 1px solid transparent;
}
.item:hover {
  background: rgba(255,255,255,.035);
  border-color: rgba(245,236,227,.04);
}
.item:active { transform: scale(.98); }
.item.active {
  background: linear-gradient(90deg, rgba(196,30,54,.28), rgba(42,6,12,.1));
  border-color: rgba(232,58,82,.12);
  box-shadow: inset 3px 0 var(--red2), 0 4px 16px rgba(196,30,54,.1);
}
.num {
  font-size: 10px; text-align: center; color: #544c46;
  font-variant-numeric: tabular-nums; font-weight: 500;
}
.item.active .num { color: var(--gold); }
.song {
  font-size: 13px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
  font-weight: 450;
  transition: color .2s;
}
.item.active .song { font-weight: 600; color: var(--cream); }
.item:hover .song { color: var(--cream2); }
.arrow {
  color: #4a433e; font-size: 13px; opacity: .4;
  transition: opacity .2s, color .2s;
}
.item.active .arrow, .item:hover .arrow { opacity: .7; color: var(--gold); }

.status {
  margin-top: 12px; padding: 11px 13px;
  border-radius: 13px;
  background: rgba(255,255,255,.02);
  border: 1px solid rgba(255,255,255,.04);
  font-size: 11px; line-height: 1.5; color: var(--muted);
  word-break: break-word; transition: all .3s;
}
.status.error {
  color: #efabb2;
  border-color: rgba(232,58,82,.28);
  background: rgba(196,30,54,.08);
}
.status.ok {
  border-color: rgba(201,168,124,.15);
  color: #c9b8ae;
}

.footer {
  text-align: center;
  padding: 18px 8px 4px;
  color: rgba(245,236,227,.22);
  font-size: 8px; letter-spacing: .14em;
}
.footer strong { color: rgba(201,168,124,.45); }

.cc-menu {
  position: absolute; right: 50px; bottom: 50px; z-index: 10;
  width: 180px; padding: 8px;
  border: 1px solid rgba(245,236,227,.1);
  border-radius: 14px;
  background: rgba(10,8,8,.97);
  display: none;
  box-shadow: 0 16px 48px rgba(0,0,0,.6), 0 0 0 1px rgba(201,168,124,.05);
}
.cc-menu.open { display: block; animation: fadeMenu .22s var(--ease-out); }
@keyframes fadeMenu {
  from { opacity: 0; transform: translateY(8px) scale(.96); }
  to { opacity: 1; transform: none; }
}
.cc-menu button {
  width: 100%; padding: 10px 12px; text-align: left;
  border-radius: 10px; font-size: 12px;
  transition: background .15s;
}
.cc-menu button:hover { background: rgba(255,255,255,.05); }
.cc-menu button.active {
  background: rgba(196,30,54,.22);
  color: var(--gold2);
}

/* ── Mobile ── */
@media (max-width: 960px) {
  .app { padding: 12px 12px calc(10px + var(--safe-b)); }
  .layout { grid-template-columns: 1fr; gap: 12px; }
  .side { max-height: none; }
  .playlist { max-height: 300px; }
}
@media (max-width: 560px) {
  .app { padding: 8px 8px calc(8px + var(--safe-b)); }
  .card { border-radius: 20px; }
  .header { margin-bottom: 12px; }
  .logo { width: 42px; height: 42px; border-radius: 13px; font-size: 11px; }
  .brand { font-size: 18px; }
  .live { display: none; }
  .now { padding: 12px 14px 4px; }
  .title { font-size: 18px; }
  .number { font-size: 18px; }
  .main-controls { padding: 10px 8px 14px; }
  .actions { gap: 10px; }
  .round { width: 42px; height: 42px; }
  .round.play { width: 56px; height: 56px; }
  .subtitle { bottom: 78px; font-size: 14px; padding: 10px 14px; width: 94%; }
  .controls-overlay { padding: 42px 10px 10px; }
  .side { padding: 12px; }
  .playlist { max-height: 260px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="identity">
      <div class="logo">HVL</div>
      <div>
        <h1 class="brand">HVL — Album Visual Experience</h1>
        <div class="eyebrow">MCK · ZEDOUS · NGER</div>
      </div>
    </div>
    <div class="live"><span class="live-dot"></span><span>ALBUM PLAYER</span></div>
  </header>

  <main class="layout">
    <section class="card">
      <div class="visual" id="visual">
        <video id="video" playsinline webkit-playsinline preload="metadata" crossorigin="anonymous"></video>
        <div class="shade"></div>
        <div class="badge">HVL / Now Playing</div>
        <div id="subtitle" class="subtitle"></div>
        <div class="corner">VISUAL ALBUM · 2026</div>
        <div class="loader"><div class="spinner"></div></div>
        <div class="buffer-bar"><div class="buffer-fill" id="bufferFill"></div></div>

        <div class="controls-overlay">
          <input id="progress" class="progress" type="range" min="0" max="1000" value="0" aria-label="Tiến trình">
          <div class="video-row">
            <button class="vbtn mini-play" id="miniPlay" aria-label="Phát">
              <svg viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z"/></svg>
            </button>
            <button class="vbtn" id="mute" aria-label="Tắt âm">
              <svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6l-5 4H4z"/><path d="M17 9.5a4 4 0 0 1 0 5"/></svg>
            </button>
            <input id="volume" class="vol" type="range" min="0" max="1" step=".01" value=".9" aria-label="Âm lượng">
            <span id="videoTime" class="time">0:00 / 0:00</span>
            <span class="spacer"></span>
            <button class="vbtn" id="cc" aria-label="Phụ đề">CC</button>
            <button class="vbtn" id="fullscreen" aria-label="Toàn màn hình">
              <svg viewBox="0 0 24 24"><path d="M8 4H4v4M16 4h4v4M20 16v4h-4M4 16v4h4"/></svg>
            </button>
          </div>
        </div>

        <div class="cc-menu" id="ccMenu">
          <button data-cc="on" class="active">● Bật phụ đề</button>
          <button data-cc="off">○ Tắt phụ đề</button>
        </div>
      </div>

      <div class="now">
        <div style="min-width:0">
          <h2 id="title" class="title">Đang tải album…</h2>
          <p id="meta" class="meta">HVL Album · —</p>
        </div>
        <div id="number" class="number">01</div>
      </div>

      <div class="main-controls">
        <div class="actions">
          <button class="round" id="shuffle" aria-label="Shuffle" title="Shuffle">
            <svg viewBox="0 0 24 24"><path d="M3 7h3c4 0 6 10 10 10h5M18 14l3 3-3 3M3 17h3c2 0 3-2 4-3M15 7h1c2 0 3 3 5 3M18 4l3 3-3 3"/></svg>
          </button>
          <button class="round" id="prev" aria-label="Bài trước">
            <svg viewBox="0 0 24 24"><path d="M6 5v14M18 7l-8 5 8 5z"/></svg>
          </button>
          <button class="round play" id="play" aria-label="Phát">
            <svg viewBox="0 0 24 24"><path d="M9 6.2v11.6L18.2 12 9 6.2z"/></svg>
          </button>
          <button class="round" id="next" aria-label="Bài tiếp">
            <svg viewBox="0 0 24 24"><path d="M18 5v14M6 7l8 5-8 5z"/></svg>
          </button>
          <button class="round" id="repeat" aria-label="Lặp">
            <svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4M3 12a6 6 0 0 1 6-6h12M7 21l-4-4 4-4M21 12a6 6 0 0 1-6 6H3"/></svg>
          </button>
        </div>
        <div class="hint"><span id="current">0:00</span> · <span id="duration">0:00</span> · HVL VISUAL PLAYER</div>
      </div>
    </section>

    <aside class="card side">
      <div class="side-head">
        <div class="side-title">Playlist</div>
        <div id="count" class="count">0 TRACKS</div>
      </div>
      <label class="search">⌕ <input id="search" placeholder="Tìm trong album…" autocomplete="off"></label>
      <div id="playlist" class="playlist"></div>
      <div id="status" class="status">Đang kết nối…</div>
    </aside>
  </main>

  <div class="footer">I'm fucked with this shit · I'm stuck with this shit · <strong>Powered by Zedous</strong></div>
</div>

<script>
'use strict';
(function () {
  var WORKER = 'https://hvl-drive-stream.mhongphat.workers.dev';
  var SUB_BASE = './subtitles/';

  var video = document.getElementById('video');
  var visual = document.getElementById('visual');
  var playlistEl = document.getElementById('playlist');
  var statusEl = document.getElementById('status');
  var titleEl = document.getElementById('title');
  var metaEl = document.getElementById('meta');
  var numberEl = document.getElementById('number');
  var countEl = document.getElementById('count');
  var progress = document.getElementById('progress');
  var volume = document.getElementById('volume');
  var videoTime = document.getElementById('videoTime');
  var currentEl = document.getElementById('current');
  var durationEl = document.getElementById('duration');
  var subtitleEl = document.getElementById('subtitle');
  var ccMenu = document.getElementById('ccMenu');
  var bufferFill = document.getElementById('bufferFill');

  var tracks = [];
  var current = 0;
  var shuffle = false;
  var repeat = false;
  var userIntent = false;
  var retry = 0;
  var retryTimer = 0;
  var subtitleOn = true;
  var cues = [];
  var cueRAF = 0;
  var loadToken = 0;
  var controlsTimer = 0;
  var isSeeking = false;
  var isSwitching = false;

  function status(t, error, ok) {
    statusEl.textContent = t;
    statusEl.className = 'status' + (error ? ' error' : ok ? ' ok' : '');
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmt(s) {
    return Number.isFinite(s) ? Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0') : '0:00';
  }
  function streamURL(id, nonce) {
    return WORKER + '/stream/' + encodeURIComponent(id) + (nonce ? '?r=' + nonce : '');
  }

  async function getJSON(url, timeout) {
    timeout = timeout || 20000;
    var c = new AbortController();
    var tm = setTimeout(function () { c.abort(); }, timeout);
    try {
      var r = await fetch(url, { cache: 'no-store', signal: c.signal, mode: 'cors' });
      var d = {};
      try { d = await r.json(); } catch (_) {}
      if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
      return d;
    } catch (e) {
      if (e.name === 'AbortError') throw new Error('Timeout — kết nối quá lâu');
      throw e;
    } finally {
      clearTimeout(tm);
    }
  }

  function setLoading(on) { visual.classList.toggle('loading', !!on); }
  function setSwitching(on) {
    isSwitching = on;
    visual.classList.toggle('switching', !!on);
  }
  function showControlsBriefly() {
    visual.classList.add('show-controls');
    clearTimeout(controlsTimer);
    controlsTimer = setTimeout(function () { visual.classList.remove('show-controls'); }, 2800);
  }

  function fadeText(on) {
    titleEl.classList.toggle('fade', on);
    metaEl.classList.toggle('fade', on);
    numberEl.classList.toggle('fade', on);
  }

  function render() {
    var q = (document.getElementById('search').value || '').trim().toLocaleLowerCase('vi');
    playlistEl.innerHTML = '';
    tracks.forEach(function (t, i) {
      if (q && !t.name.toLocaleLowerCase('vi').includes(q)) return;
      var x = document.createElement('button');
      x.className = 'item' + (i === current ? ' active' : '');
      x.innerHTML = '<span class="num">' + String(i + 1).padStart(2, '0') + '</span><span class="song">' + esc(t.name.replace(/\.mp4$/i, '')) + '</span><span class="arrow">›</span>';
      x.onclick = function () { select(i, true); };
      playlistEl.appendChild(x);
    });
    countEl.textContent = tracks.length + ' TRACKS';
    metaEl.textContent = 'HVL Album · ' + (tracks.length ? current + 1 : 0) + ' / ' + tracks.length;
    numberEl.textContent = String(current + 1).padStart(2, '0');
  }

  function subtitleURL(t) {
    return SUB_BASE + encodeURIComponent(t.name.replace(/\.[^/.]+$/, '') + '.vtt');
  }

  function parseVTT(text) {
    text = text.replace(/\r/g, '').replace(/^WEBVTT[^\n]*\n?/i, '');
    return text.split(/\n\s*\n/).map(function (b) {
      var a = b.split('\n');
      var i = a.findIndex(function (x) { return x.indexOf('-->') >= 0; });
      if (i < 0) return null;
      var m = a[i].match(/(?:(\d+):)?(\d{2}):(\d{2})[.,](\d{3})\s*-->\s*(?:(\d+):)?(\d{2}):(\d{2})[.,](\d{3})/);
      if (!m) return null;
      function sec(h, m, s, ms) { return (+h || 0) * 3600 + (+m) * 60 + (+s) + (+ms) / 1000; }
      return {
        start: sec(m[1], m[2], m[3], m[4]),
        end: sec(m[5], m[6], m[7], m[8]),
        text: a.slice(i + 1).join('\n').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '').trim()
      };
    }).filter(Boolean).sort(function (a, b) { return a.start - b.start; });
  }

  async function loadSubs(t) {
    var token = ++loadToken;
    cues = [];
    subtitleEl.classList.remove('show');
    try {
      var r = await fetch(subtitleURL(t), { cache: 'no-store' });
      if (!r.ok) throw 0;
      var c = parseVTT(await r.text());
      if (token !== loadToken) return;
      cues = c;
      document.getElementById('cc').disabled = !cues.length;
      if (cues.length) startCues();
    } catch (_) {
      document.getElementById('cc').disabled = true;
    }
  }

  function startCues() {
    cancelAnimationFrame(cueRAF);
    function loop() {
      if (subtitleOn && !video.paused && cues.length) {
        var found = null;
        var t = video.currentTime;
        for (var i = cues.length - 1; i >= 0; i--) {
          if (t >= cues[i].start) {
            if (t <= cues[i].end) found = cues[i];
            break;
          }
        }
        if (found) {
          subtitleEl.innerHTML = esc(found.text).replace(/\n/g, '<br>');
          subtitleEl.classList.add('show');
        } else {
          subtitleEl.classList.remove('show');
        }
      }
      cueRAF = requestAnimationFrame(loop);
    }
    cueRAF = requestAnimationFrame(loop);
  }

  function chooseNext() {
    if (!tracks.length) return 0;
    if (shuffle && tracks.length > 1) {
      var n;
      do { n = Math.floor(Math.random() * tracks.length); } while (n === current);
      return n;
    }
    return (current + 1) % tracks.length;
  }

  function setSource(t, nonce) {
    video.pause();
    video.removeAttribute('src');
    video.load();
    video.src = streamURL(t.id, nonce || 0);
    video.preload = 'auto';
    video.load();
  }

  /* Smooth track switch: fade out → load → fade in */
  async function select(i, play) {
    if (!tracks.length) return;
    if (isSwitching) return;

    var wasPlaying = !video.paused || play;
    setSwitching(true);
    fadeText(true);
    subtitleEl.classList.remove('show');

    // short fade-out
    await new Promise(function (r) { setTimeout(r, 280); });

    current = Math.max(0, Math.min(i, tracks.length - 1));
    var t = tracks[current];
    retry = 0;
    clearTimeout(retryTimer);

    titleEl.textContent = t.name.replace(/\.mp4$/i, '');
    render();
    loadSubs(t);
    setSource(t);
    sync();
    fadeText(false);

    status(wasPlaying ? 'Đang mở video…' : '✓ Sẵn sàng · Bấm Play', false, true);

    if (wasPlaying) {
      userIntent = true;
      try {
        await playCurrent();
      } finally {
        setSwitching(false);
        setLoading(false);
      }
    } else {
      setSwitching(false);
      setLoading(false);
    }
  }

  function waitPlayable(ms) {
    ms = ms || 14000;
    return new Promise(function (res, rej) {
      if (video.readyState >= 2) return res();
      var done = false;
      function ok() { if (done) return; done = true; clean(); res(); }
      function bad() { if (done) return; done = true; clean(); rej(new Error('MEDIA_ERROR')); }
      var tm = setTimeout(function () { if (done) return; done = true; clean(); rej(new Error('MEDIA_TIMEOUT')); }, ms);
      function clean() {
        clearTimeout(tm);
        video.removeEventListener('canplay', ok);
        video.removeEventListener('loadeddata', ok);
        video.removeEventListener('error', bad);
      }
      video.addEventListener('canplay', ok, { once: true });
      video.addEventListener('loadeddata', ok, { once: true });
      video.addEventListener('error', bad, { once: true });
    });
  }

  async function playCurrent() {
    if (!tracks.length) return false;
    var t = tracks[current];
    userIntent = true;
    setLoading(true);
    try {
      if (!video.src || !String(video.currentSrc || '').includes('/stream/')) setSource(t);
      if (video.readyState < 2) await waitPlayable(14000);
      video.muted = false;
      video.volume = +volume.value;
      var p = video.play();
      if (p) await p;
      retry = 0;
      setLoading(false);
      setSwitching(false);
      status('✓ Đang phát · HVL Stream', false, true);
      sync();
      showControlsBriefly();
      return true;
    } catch (e) {
      console.warn('HVL play', e);
      setLoading(false);
      setSwitching(false);
      if (e.name === 'NotAllowedError') {
        status('⚠ Bấm Play để bắt đầu (trình duyệt chặn autoplay).', true);
        return false;
      }
      if ((video.error && (video.error.code === 3 || video.error.code === 4)) || e.name === 'NotSupportedError') {
        status('❌ Video không giải mã được. Cần MP4 H.264+AAC.', true);
        return false;
      }
      return recover();
    }
  }

  async function recover() {
    if (!userIntent || retry >= 3) { setLoading(false); setSwitching(false); return false; }
    var t = tracks[current];
    var keep = Number.isFinite(video.currentTime) ? video.currentTime : 0;
    var n = ++retry;
    status('Đang kết nối lại… (' + n + '/3)');
    setLoading(true);
    setSource(t, n);
    try {
      await waitPlayable(14000);
      if (keep > 1 && Number.isFinite(video.duration) && keep < video.duration - 1) video.currentTime = keep;
      video.muted = false;
      video.volume = +volume.value;
      await video.play();
      setLoading(false);
      setSwitching(false);
      status('✓ Đã kết nối lại', false, true);
      retry = 0;
      return true;
    } catch (e) {
      if (n < 3) {
        clearTimeout(retryTimer);
        retryTimer = setTimeout(recover, 800 * n);
      } else {
        setLoading(false);
        setSwitching(false);
        status('❌ Không mở được stream.', true);
      }
      return false;
    }
  }

  function sync() {
    var playing = !video.paused;
    var iconPlay = '<svg viewBox="0 0 24 24"><path d="M9 6.2v11.6L18.2 12 9 6.2z"/></svg>';
    var iconPause = '<svg viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round"><path d="M8 6v12M16 6v12"/></svg>';
    document.getElementById('play').innerHTML = document.getElementById('miniPlay').innerHTML = playing ? iconPause : iconPlay;
  }

  function togglePlay() {
    if (video.paused) { userIntent = true; playCurrent(); }
    else { userIntent = false; video.pause(); sync(); }
  }
  function next() { if (tracks.length && !isSwitching) select(chooseNext(), true); }
  function prev() {
    if (isSwitching) return;
    if (video.currentTime > 4) { video.currentTime = 0; return; }
    select((current - 1 + tracks.length) % tracks.length, true);
  }
  function setVolume(v) {
    v = Math.max(0, Math.min(1, +v));
    video.volume = v;
    video.muted = v === 0;
    volume.value = v;
    document.getElementById('mute').classList.toggle('active', v === 0);
  }

  function updateBuffer() {
    try {
      if (video.buffered.length && Number.isFinite(video.duration) && video.duration > 0) {
        var end = video.buffered.end(video.buffered.length - 1);
        bufferFill.style.width = Math.min(100, (end / video.duration) * 100) + '%';
      }
    } catch (_) {}
  }
  function update() {
    if (isSeeking) return;
    var d = video.duration;
    if (Number.isFinite(d) && d > 0) {
      var p = (video.currentTime / d) * 1000;
      progress.value = p;
      progress.style.setProperty('--p', (p / 10) + '%');
      currentEl.textContent = fmt(video.currentTime);
      durationEl.textContent = fmt(d);
      videoTime.textContent = fmt(video.currentTime) + ' / ' + fmt(d);
    }
    updateBuffer();
  }

  video.addEventListener('timeupdate', update);
  video.addEventListener('progress', updateBuffer);
  video.addEventListener('loadedmetadata', function () {
    update(); setLoading(false); status('✓ Stream sẵn sàng · Bấm Play', false, true);
  });
  video.addEventListener('playing', function () {
    retry = 0; setLoading(false); setSwitching(false);
    status('✓ Đang phát · HVL Stream', false, true); sync(); startCues();
  });
  video.addEventListener('pause', sync);
  video.addEventListener('waiting', function () {
    if (userIntent) { setLoading(true); status('Đang đệm…'); }
  });
  video.addEventListener('canplay', function () { setLoading(false); });
  video.addEventListener('stalled', function () { if (userIntent) recover(); });
  video.addEventListener('error', function () {
    if (!userIntent) return;
    var c = video.error && video.error.code;
    if (c === 3 || c === 4) status('❌ Video không giải mã được.', true);
    else recover();
  });
  video.addEventListener('ended', function () {
    if (repeat) { video.currentTime = 0; playCurrent(); }
    else next();
  });

  progress.addEventListener('input', function () {
    isSeeking = true;
    if (Number.isFinite(video.duration)) {
      var t = (+progress.value / 1000) * video.duration;
      progress.style.setProperty('--p', (progress.value / 10) + '%');
      currentEl.textContent = fmt(t);
      videoTime.textContent = fmt(t) + ' / ' + fmt(video.duration);
    }
  });
  progress.addEventListener('change', function () {
    if (Number.isFinite(video.duration)) video.currentTime = (+progress.value / 1000) * video.duration;
    isSeeking = false;
  });
  volume.addEventListener('input', function () { setVolume(volume.value); });
  volume.addEventListener('change', function () { video.dataset.prev = volume.value; });

  document.getElementById('mute').onclick = function () {
    setVolume(video.muted || video.volume === 0 ? +(video.dataset.prev || 0.9) : 0);
  };
  document.getElementById('play').onclick = togglePlay;
  document.getElementById('miniPlay').onclick = togglePlay;
  document.getElementById('next').onclick = next;
  document.getElementById('prev').onclick = prev;
  document.getElementById('shuffle').onclick = function () {
    shuffle = !shuffle;
    document.getElementById('shuffle').classList.toggle('active', shuffle);
  };
  document.getElementById('repeat').onclick = function () {
    repeat = !repeat;
    document.getElementById('repeat').classList.toggle('active', repeat);
  };
  document.getElementById('search').oninput = render;
  document.getElementById('cc').onclick = function (e) {
    e.stopPropagation();
    ccMenu.classList.toggle('open');
  };
  document.querySelectorAll('[data-cc]').forEach(function (b) {
    b.onclick = function () {
      subtitleOn = b.dataset.cc === 'on';
      document.querySelectorAll('[data-cc]').forEach(function (x) { x.classList.toggle('active', x === b); });
      if (!subtitleOn) subtitleEl.classList.remove('show');
      ccMenu.classList.remove('open');
    };
  });
  document.addEventListener('click', function (e) {
    if (!ccMenu.contains(e.target) && e.target.id !== 'cc') ccMenu.classList.remove('open');
  });
  document.getElementById('fullscreen').onclick = async function () {
    try {
      if (!document.fullscreenElement) {
        if (visual.requestFullscreen) await visual.requestFullscreen();
        else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
      } else await document.exitFullscreen();
    } catch (_) {
      try { video.webkitEnterFullscreen(); } catch (__) {}
    }
  };

  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === ' ') { e.preventDefault(); togglePlay(); }
    else if (e.key === 'ArrowRight') video.currentTime = Math.min(video.duration || 0, video.currentTime + 5);
    else if (e.key === 'ArrowLeft') video.currentTime = Math.max(0, video.currentTime - 5);
    else if (e.key === 'ArrowUp') { e.preventDefault(); setVolume(Math.min(1, video.volume + 0.05)); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); setVolume(Math.max(0, video.volume - 0.05)); }
    else if (e.key === 'm' || e.key === 'M') document.getElementById('mute').click();
    else if (e.key === 'f' || e.key === 'F') document.getElementById('fullscreen').click();
    else if (e.key === 'n' || e.key === 'N') next();
    else if (e.key === 'p' || e.key === 'P') prev();
    showControlsBriefly();
  });

  if ('mediaSession' in navigator) {
    try {
      navigator.mediaSession.setActionHandler('play', function () { userIntent = true; playCurrent(); });
      navigator.mediaSession.setActionHandler('pause', function () { userIntent = false; video.pause(); });
      navigator.mediaSession.setActionHandler('nexttrack', next);
      navigator.mediaSession.setActionHandler('previoustrack', prev);
    } catch (_) {}
  }

  async function init() {
    if (location.protocol === 'file:') {
      status('⚠ Không mở bằng file://. Dùng Live Server / GitHub Pages.', true);
      return;
    }
    status('Đang tải playlist…');
    try {
      var d = await getJSON(WORKER + '/playlist', 20000);
      tracks = (d.files || []).filter(function (x) { return x.id && x.name; });
      if (!tracks.length) {
        status('❌ Folder không có video.', true);
        return;
      }
      render();
      await select(0, false);
      status('✓ ' + tracks.length + ' bài · HVL Stream Ready', false, true);
    } catch (e) {
      console.error(e);
      status('❌ ' + ((e && e.message) ? e.message : String(e)), true);
    }
  }

  setVolume(0.9);
  init();
})();
</script>
