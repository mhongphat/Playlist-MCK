<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HVL Music — Playlist</title>
<style>
:root{--bg:#08090c;--panel:#11141a;--panel2:#171b23;--line:#252b36;--text:#f5f7fb;--muted:#8e98a8;--accent:#6d5dfc}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% -10%,#211c48 0,#0b0c10 35%,#08090c 70%);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}.header{height:72px;border-bottom:1px solid #ffffff12;display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:5;background:#08090ccc;backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#6d5dfc,#c25cff);display:grid;place-items:center;font-size:21px}.brand small{display:block;color:var(--muted);font-size:10px}.search{width:min(360px,38vw);background:#11141a;border:1px solid var(--line);border-radius:12px;padding:10px 13px;color:#fff;outline:0}.container{max-width:1450px;margin:auto;padding:28px}.hero{margin-bottom:22px}.hero h1{font-size:clamp(28px,3vw,42px);margin:0 0 7px;letter-spacing:-1px}.hero p{margin:0;color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:22px}.card{background:#11141ae8;border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 70px #00000045;overflow:hidden}.player{padding:12px}.videoShell{background:#000;border-radius:14px;overflow:hidden}video{width:100%;display:block;aspect-ratio:16/9;background:#000}.now{padding:18px 18px 4px}.now h2{font-size:20px;margin:0 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.muted{color:var(--muted);font-size:13px}.controls{display:flex;align-items:center;gap:8px;padding:15px 18px 18px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#1b2029;color:#fff;border-radius:10px;padding:10px 13px}.btn:hover{background:#252b35}.primary{background:#6d5dfc!important;border-color:#6d5dfc}.spacer{flex:1}.volume{width:100px;accent-color:#6d5dfc}.queueHead{padding:18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.queueHead h2{font-size:17px;margin:0}.queue{max-height:650px;overflow:auto;padding:8px}.item{display:grid;grid-template-columns:34px 1fr 30px;gap:10px;align-items:center;padding:11px 10px;border-radius:12px;margin:3px 0;cursor:pointer}.item:hover{background:#1d222b}.item.active{background:#6d5dfc26;outline:1px solid #6d5dfc44}.num{text-align:center;color:#7f8998;font-size:12px}.track{min-width:0}.track b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.playIcon{text-align:center;color:#aaa}.empty{padding:35px 15px;color:var(--muted);text-align:center;line-height:1.6}.footer{text-align:center;color:#697384;font-size:12px;margin-top:20px}@media(max-width:980px){.layout{grid-template-columns:1fr}.queue{max-height:420px}}@media(max-width:650px){.header{padding:0 15px}.brand small{display:none}.search{width:150px}.container{padding:20px 14px}.card{border-radius:15px}}
</style></head>
<body>
<header class="header"><div class="brand"><div class="logo">♪</div><div>Tao La Music<small>PLAYLIST</small></div></div><input id="search" class="search" placeholder="Tìm trong playlist..."></header>
<main class="container"><section class="hero"><h1>Music Playlist</h1><p>Nghe liên tục • Tự động chuyển bài </p></section>
<div class="layout"><section class="card"><div class="player"><div class="videoShell"><video id="video" controls playsinline preload="metadata"></video></div><div class="now"><h2 id="title">Đang tải playlist…</h2><p id="meta" class="muted">Vui lòng chờ một chút</p></div>
<div class="controls"><button class="btn" id="prev">⏮ Trước</button><button class="btn primary" id="toggle">▶ Phát</button><button class="btn" id="next">Tiếp ⏭</button><button class="btn" id="shuffle">🔀 Ngẫu nhiên</button><button class="btn" id="repeat">🔁 Lặp: Tắt</button><span class="spacer"></span><span class="muted">🔊</span><input id="volume" class="volume" type="range" min="0" max="1" step=".05" value="1"></div></div></section>
<aside class="card"><div class="queueHead"><h2>Danh sách phát</h2><span id="count" class="muted">—</span></div><div id="queue" class="queue"><div class="empty">Đang tải video </div></div></aside></div><div class="footer"> I'm fuck on this shit • Powered by Zedous</div></main>
<script>
const CONFIG={API_KEY:"AIzaSyBv2xnFQxz5P6PEosKNKaO3BrV6a_pSfDY",FOLDER_ID:"1ckf_j0cc-87VPG186w2Ilm003pt0ifjR"};
const video=document.getElementById("video"),queue=document.getElementById("queue"),title=document.getElementById("title"),meta=document.getElementById("meta"),count=document.getElementById("count"),search=document.getElementById("search");
let tracks=[],current=0,repeat=false,shuffle=false;
const media=id=>"https://www.googleapis.com/drive/v3/files/"+encodeURIComponent(id)+"?alt=media&key="+encodeURIComponent(CONFIG.API_KEY);
const safe=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){let q=search.value.trim().toLowerCase(),a=tracks.map((x,i)=>({x,i})).filter(o=>o.x.name.toLowerCase().includes(q));count.textContent=tracks.length+" video";queue.innerHTML=a.length?a.map(o=>`<div class="item ${o.i===current?"active":""}" data-i="${o.i}"><div class="num">${o.i+1}</div><div class="track"><b>${safe(o.x.name)}</b><span>Zedous/span></div><div class="playIcon">${o.i===current?"▶":"•••"}</div></div>`).join(""):'<div class="empty">Không tìm thấy video.</div>';queue.querySelectorAll(".item").forEach(e=>e.onclick=()=>play(+e.dataset.i,true))}
function play(i,auto){if(!tracks.length)return;current=(i+tracks.length)%tracks.length;let t=tracks[current];title.textContent=t.name;meta.textContent=(current+1)+" / "+tracks.length+" • Google Drive";video.src=media(t.id);video.load();render();if(auto)video.play().catch(()=>meta.textContent=(current+1)+" / "+tracks.length+" • Bấm ▶ để phát")}
function next(){if(!tracks.length)return;if(shuffle&&tracks.length>1){let n;do n=Math.floor(Math.random()*tracks.length);while(n===current);return play(n,true)}if(current<tracks.length-1)play(current+1,true);else if(repeat)play(0,true);else{video.pause();meta.textContent=tracks.length+" / "+tracks.length+" • Đã hết playlist"}}
async function load(){if(CONFIG.API_KEY.includes("PASTE_")){queue.innerHTML='<div class="empty">Chưa cấu hình API Key.<br>Thay <b>PASTE_YOUR_GOOGLE_DRIVE_API_KEY_HERE</b> trong file.</div>';return}try{let token="",files=[];do{let p=new URLSearchParams({q:`'${CONFIG.FOLDER_ID}' in parents and trashed=false and mimeType contains 'video/'`,key:CONFIG.API_KEY,pageSize:"1000",fields:"nextPageToken,files(id,name,mimeType)"});if(token)p.set("pageToken",token);let r=await fetch("https://www.googleapis.com/drive/v3/files?"+p),d=await r.json();if(!r.ok)throw Error(d.error?.message||"Google Drive API error");files.push(...(d.files||[]));token=d.nextPageToken||""}while(token);tracks=files.sort((a,b)=>a.name.localeCompare(b.name,"vi",{numeric:true,sensitivity:"base"}));if(!tracks.length){queue.innerHTML='<div class="empty">Không tìm thấy video trong folder.</div>';return}play(0,false)}catch(e){queue.innerHTML='<div class="empty">Không tải được playlist.<br><br><b>'+safe(e.message)+'</b><br><br>Kiểm tra API Key, Drive API và quyền chia sẻ.</div>'}}
document.getElementById("toggle").onclick=()=>video.paused?video.play():video.pause();document.getElementById("next").onclick=next;document.getElementById("prev").onclick=()=>tracks.length&&play(current-1,true);document.getElementById("shuffle").onclick=e=>(shuffle=!shuffle,e.currentTarget.textContent=shuffle?"🔀 Ngẫu nhiên: Bật":"🔀 Ngẫu nhiên");document.getElementById("repeat").onclick=e=>(repeat=!repeat,e.currentTarget.textContent=repeat?"🔁 Lặp: Bật":"🔁 Lặp: Tắt");document.getElementById("volume").oninput=e=>video.volume=e.target.value;video.onended=next;video.onplay=()=>document.getElementById("toggle").textContent="⏸ Tạm dừng";video.onpause=()=>document.getElementById("toggle").textContent="▶ Phát";video.onerror=()=>meta.textContent="Không thể phát video này. Kiểm tra quyền file/API key.";search.oninput=render;load();
</script></body></html>
