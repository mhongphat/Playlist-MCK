<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#030303">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>HVL — Album Visual Experience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap');

:root {
  --bg: #030303;
  --surface: #0a0909;
  --wine: #2e0810;
  --red: #c41e36;
  --red2: #e8324a;
  --cream: #f5ece3;
  --muted: #6e6660;
  --line: rgba(245,236,227,.07);
  --glow: rgba(196,30,54,.4);
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --ease: cubic-bezier(.22,.68,0,1.1);
  --ease-out: cubic-bezier(.16,1,.3,1);
}

* { box-sizing: border-box; -webkit-font-smoothing: antialiased; margin: 0; padding: 0; }
html, body {
  height: 100%;
  background: var(--bg);
  color: var(--cream);
  font-family: "Be Vietnam Pro", system-ui, sans-serif;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-text-size-adjust: 100%;
}
body {
  background:
    radial-gradient(ellipse 80% 50% at 50% -20%, rgba(196,30,54,.18), transparent 55%),
    radial-gradient(ellipse 60% 40% at 100% 100%, rgba(46,8,16,.35), transparent 50%),
    #030303;
}

button, input { font: inherit; color: inherit; }
button {
  cursor: pointer; border: none; background: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
button:disabled { opacity: .4; }

/* ═══ APP SHELL ═══ */
.app {
  height: 100dvh;
  height: 100vh;
  display: flex;
  flex-direction: column;
  padding:
    max(8px, var(--safe-t))
    max(10px, var(--safe-r))
    max(6px, var(--safe-b))
    max(10px, var(--safe-l));
  max-width: 1600px;
  margin: 0 auto;
}

/* ═══ HEADER ═══ */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 4px 2px 10px;
  flex-shrink: 0;
}
.identity { display: flex; align-items: center; gap: 12px; }
.logo {
  width: 42px; height: 42px; border-radius: 13px;
  display: grid; place-items: center;
  font-size: 11px; font-weight: 800; letter-spacing: .14em;
  background: linear-gradient(145deg, var(--red2), var(--wine));
  box-shadow: 0 8px 28px var(--glow);
}
.brand {
  font: 600 22px/1.05 "Cormorant Garamond", Georgia, serif;
}
.eyebrow {
  font-size: 8px; color: var(--muted);
  letter-spacing: .2em; margin-top: 3px; text-transform: uppercase;
}
.live {
  display: flex; align-items: center; gap: 7px;
  font-size: 8px; letter-spacing: .16em; color: #9a8e85;
}
.live-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--red2);
  box-shadow: 0 0 10px var(--red2);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%,100% { opacity: 1; } 50% { opacity: .4; }
}

/* ═══ MAIN LAYOUT ═══ */
.stage {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 1fr;
  gap: 0;
  position: relative;
}
.stage.lyrics-open {
  grid-template-columns: 1fr minmax(280px, 340px);
  gap: 12px;
}

/* ═══ CINEMA SCREEN ═══ */
.screen {
  position: relative;
  min-height: 0;
  border-radius: 18px;
  overflow: hidden;
  background: #000;
  border: 1px solid var(--line);
  box-shadow:
    0 0 0 1px rgba(0,0,0,.5),
    0 24px 80px rgba(0,0,0,.7),
    0 0 100px rgba(196,30,54,.06);
  display: flex;
  flex-direction: column;
}

.visual {
  position: relative;
  flex: 1;
  min-height: 0;
  background: #000;
}
.visual video {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: contain;
  background: #000;
  /* iOS: prevent default controls overlay issues */
  -webkit-playsinline: true;
}
.shade {
  position: absolute; inset: 0; pointer-events: none; z-index: 2;
  background: linear-gradient(
    180deg,
    rgba(0,0,0,.35) 0%,
    transparent 20%,
    transparent 55%,
    rgba(0,0,0,.9) 100%
  );
}

.badge {
  position: absolute; z-index: 4; top: 12px; left: 12px;
  padding: 5px 11px; border-radius: 99px;
  font-size: 7px; letter-spacing: .16em; color: #e0d4c8;
  border: 1px solid rgba(255,255,255,.1);
  background: rgba(0,0,0,.55); backdrop-filter: blur(12px);
  pointer-events: none;
}

/* Floating subtitle on video */
.sub-float {
  position: absolute; z-index: 5;
  left: 50%; bottom: 72px;
  transform: translateX(-50%);
  width: min(92%, 760px);
  padding: 10px 16px;
  border-radius: 12px;
  text-align: center;
  background: rgba(0,0,0,.72);
  border: 1px solid rgba(245,236,227,.05);
  font-size: clamp(14px, 2.2vw, 20px);
  font-weight: 600;
  line-height: 1.4;
  opacity: 0;
  transition: opacity .25s;
  pointer-events: none;
  text-shadow: 0 2px 10px rgba(0,0,0,.6);
}
.sub-float.show { opacity: 1; }

.loader {
  position: absolute; inset: 0; z-index: 6;
  display: grid; place-items: center;
  background: rgba(0,0,0,.45);
  opacity: 0; pointer-events: none; transition: opacity .3s;
}
.visual.loading .loader { opacity: 1; }
.spinner {
  width: 36px; height: 36px;
  border: 2.5px solid rgba(245,236,227,.12);
  border-top-color: var(--red2);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.buffer-bar {
  position: absolute; left: 0; right: 0; bottom: 0; height: 2px; z-index: 4;
  background: rgba(255,255,255,.05);
}
.buffer-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--wine), var(--red2));
  transition: width .15s linear;
}

/* Controls bar inside screen */
.bar {
  position: relative; z-index: 8;
  padding: 8px 14px 12px;
  background: linear-gradient(180deg, transparent, rgba(0,0,0,.95) 30%);
  flex-shrink: 0;
}
.progress {
  width: 100%; height: 4px; appearance: none; border-radius: 99px; cursor: pointer;
  background: linear-gradient(90deg, var(--red2) 0, var(--red2) var(--p,0%), rgba(255,255,255,.12) var(--p,0%), rgba(255,255,255,.12) 100%);
  margin-bottom: 8px;
}
.progress::-webkit-slider-thumb {
  appearance: none; width: 13px; height: 13px; border-radius: 50%;
  background: var(--cream); box-shadow: 0 0 10px var(--glow);
}
.bar-row {
  display: flex; align-items: center; gap: 6px;
}
.vbtn {
  width: 36px; height: 34px; border-radius: 10px;
  display: grid; place-items: center;
  border: 1px solid rgba(245,236,227,.08);
  background: rgba(10,8,8,.5); color: var(--cream);
  transition: background .2s, transform .12s;
}
.vbtn:active { transform: scale(.92); }
.vbtn.active, .vbtn:hover { background: rgba(196,30,54,.28); border-color: rgba(232,50,74,.4); }
.vbtn svg {
  width: 15px; height: 15px;
  fill: none; stroke: currentColor; stroke-width: 1.8;
  stroke-linecap: round; stroke-linejoin: round;
}
.mini-play svg { fill: currentColor; stroke: none; }
.vol { width: 56px; height: 3px; accent-color: var(--red2); }
.time {
  font-size: 10px; color: rgba(245,236,227,.6);
  white-space: nowrap; font-variant-numeric: tabular-nums;
  min-width: 72px;
}
.spacer { flex: 1; }

/* Now + transport */
.dock {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 4px 0;
  flex-shrink: 0;
}
.now-info { flex: 1; min-width: 0; }
.now-title {
  font: 600 clamp(16px, 2.5vw, 24px)/1.15 "Cormorant Garamond", Georgia, serif;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.now-meta {
  font-size: 10px; color: var(--muted); margin-top: 3px;
}
.transport {
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
}
.round {
  width: 42px; height: 42px; border-radius: 50%;
  display: grid; place-items: center;
  border: 1px solid rgba(245,236,227,.08);
  background: rgba(255,255,255,.03); color: var(--cream);
  transition: all .2s var(--ease);
}
.round:active { transform: scale(.93); }
.round svg {
  width: 16px; height: 16px;
  fill: none; stroke: currentColor; stroke-width: 1.8;
  stroke-linecap: round; stroke-linejoin: round;
}
.round.active { background: rgba(196,30,54,.35); border-color: rgba(232,50,74,.45); }
.round.play {
  width: 54px; height: 54px;
  background: linear-gradient(145deg, #e8324a, #6a101c);
  border: 0;
  box-shadow: 0 10px 32px rgba(196,30,54,.4);
}
.round.play svg { width: 20px; height: 20px; fill: currentColor; stroke: none; }

/* ═══ LYRICS PANEL ═══ */
.lyrics-panel {
  display: none;
  flex-direction: column;
  min-height: 0;
  border-radius: 18px;
  border: 1px solid var(--line);
  background: linear-gradient(165deg, rgba(14,11,11,.97), rgba(6,5,5,.99));
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
  overflow: hidden;
}
.stage.lyrics-open .lyrics-panel { display: flex; }

.lyrics-head {
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: center;
  flex-shrink: 0;
}
.lyrics-title {
  font: 600 18px "Cormorant Garamond", Georgia, serif;
}
.lyrics-close {
  width: 32px; height: 32px; border-radius: 50%;
  display: grid; place-items: center;
  border: 1px solid var(--line);
  color: var(--muted); font-size: 16px;
}
.lyrics-close:active { background: rgba(255,255,255,.06); }

.lyrics-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px 18px 28px;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: rgba(196,30,54,.3) transparent;
}
.lyrics-body::-webkit-scrollbar { width: 4px; }
.lyrics-body::-webkit-scrollbar-thumb {
  background: rgba(196,30,54,.3); border-radius: 99px;
}

.lyric-line {
  padding: 8px 10px;
  margin: 2px 0;
  border-radius: 10px;
  font-size: 15px;
  line-height: 1.5;
  color: rgba(245,236,227,.35);
  transition: color .25s, background .25s, transform .25s;
  cursor: pointer;
}
.lyric-line:hover { color: rgba(245,236,227,.55); }
.lyric-line.active {
  color: var(--cream);
  background: rgba(196,30,54,.15);
  font-weight: 600;
  transform: scale(1.02);
  box-shadow: inset 3px 0 var(--red2);
}
.lyric-empty {
  text-align: center;
  padding: 40px 16px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
}

/* ═══ PLAYLIST DRAWER (mobile-friendly) ═══ */
.drawer-toggle {
  display: none;
  position: fixed;
  bottom: calc(16px + var(--safe-b));
  right: calc(14px + var(--safe-r));
  z-index: 30;
  width: 52px; height: 52px;
  border-radius: 50%;
  background: linear-gradient(145deg, var(--red2), var(--wine));
  box-shadow: 0 8px 28px var(--glow);
  color: var(--cream);
  font-size: 11px; font-weight: 700; letter-spacing: .06em;
  align-items: center; justify-content: center;
}
.drawer {
  position: fixed;
  inset: 0;
  z-index: 40;
  pointer-events: none;
  opacity: 0;
  transition: opacity .3s;
}
.drawer.open {
  pointer-events: auto;
  opacity: 1;
}
.drawer-bg {
  position: absolute; inset: 0;
  background: rgba(0,0,0,.65);
  backdrop-filter: blur(6px);
}
.drawer-sheet {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  max-height: 72dvh;
  border-radius: 22px 22px 0 0;
  background: linear-gradient(180deg, #121010, #080707);
  border: 1px solid var(--line);
  border-bottom: 0;
  padding: 12px 14px calc(16px + var(--safe-b));
  transform: translateY(100%);
  transition: transform .35s var(--ease-out);
  display: flex; flex-direction: column;
}
.drawer.open .drawer-sheet { transform: none; }
.drawer-handle {
  width: 40px; height: 4px; border-radius: 99px;
  background: rgba(255,255,255,.15);
  margin: 0 auto 12px;
}
.drawer-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 10px;
}
.drawer-title {
  font: 600 18px "Cormorant Garamond", Georgia, serif;
}
.count { font-size: 9px; letter-spacing: .12em; color: var(--muted); }
.search {
  height: 40px; margin-bottom: 8px; padding: 0 12px;
  border-radius: 12px; border: 1px solid var(--line);
  display: flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,.03);
}
.search input {
  width: 100%; border: 0; outline: 0; background: transparent;
  color: var(--cream); font-size: 13px;
}
.search input::placeholder { color: var(--muted); }
.playlist {
  overflow-y: auto; flex: 1;
  -webkit-overflow-scrolling: touch;
}
.item {
  display: grid;
  grid-template-columns: 32px 1fr 16px;
  gap: 8px; align-items: center;
  padding: 11px 10px; margin: 2px 0;
  border-radius: 12px; width: 100%; text-align: left;
  transition: background .2s;
}
.item:active { background: rgba(255,255,255,.05); }
.item.active {
  background: linear-gradient(90deg, rgba(196,30,54,.3), transparent);
  box-shadow: inset 3px 0 var(--red2);
}
.num { font-size: 10px; text-align: center; color: #5a534d; font-variant-numeric: tabular-nums; }
.item.active .num { color: #e8a8b0; }
.song {
  font-size: 13px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.arrow { color: #5a534d; opacity: .5; }

.status {
  margin-top: 8px; padding: 8px 10px;
  border-radius: 10px;
  background: rgba(255,255,255,.02);
  border: 1px solid rgba(255,255,255,.04);
  font-size: 10px; color: var(--muted); line-height: 1.4;
}
.status.error { color: #efabb2; border-color: rgba(232,50,74,.3); background: rgba(196,30,54,.08); }
.status.ok { color: #c9b8ae; border-color: rgba(232,50,74,.12); }

/* Desktop playlist sidebar (optional, shown large screens without drawer) */
.side-desktop {
  display: none;
}

/* ═══ RESPONSIVE ═══ */
@media (min-width: 900px) {
  .stage {
    grid-template-columns: 1fr 300px;
    gap: 12px;
  }
  .stage.lyrics-open {
    grid-template-columns: 1fr minmax(300px, 360px) 280px;
  }
  .side-desktop {
    display: flex;
    flex-direction: column;
    min-height: 0;
    border-radius: 18px;
    border: 1px solid var(--line);
    background: linear-gradient(165deg, rgba(14,11,11,.97), rgba(6,5,5,.99));
    padding: 12px;
    overflow: hidden;
  }
  .side-desktop .playlist { flex: 1; overflow-y: auto; }
  .drawer-toggle { display: none !important; }
}

@media (max-width: 899px) {
  .drawer-toggle { display: flex; }
  .stage.lyrics-open {
    grid-template-columns: 1fr;
  }
  .stage.lyrics-open .lyrics-panel {
    position: fixed;
    inset: 0;
    z-index: 35;
    border-radius: 0;
    max-height: none;
    padding-top: var(--safe-t);
  }
  .brand { font-size: 17px; }
  .logo { width: 36px; height: 36px; border-radius: 11px; font-size: 10px; }
  .live { display: none; }
  .dock { gap: 8px; }
  .round { width: 38px; height: 38px; }
  .round.play { width: 48px; height: 48px; }
  .sub-float { bottom: 64px; font-size: 13px; padding: 8px 12px; }
  .vol { display: none; }
}

/* Landscape phone: maximize video */
@media (max-height: 500px) and (orientation: landscape) {
  .header { padding: 2px 0 4px; }
  .logo { width: 28px; height: 28px; }
  .brand { font-size: 14px; }
  .eyebrow { display: none; }
  .dock { padding: 4px 0 0; }
  .now-title { font-size: 14px; }
  .round { width: 34px; height: 34px; }
  .round.play { width: 40px; height: 40px; }
  .bar { padding: 4px 10px 6px; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="identity">
      <div class="logo">HVL</div>
      <div>
        <h1 class="brand">HVL — Cinema</h1>
        <div class="eyebrow">MCK · ZEDOUS · NGER</div>
      </div>
    </div>
    <div class="live"><span class="live-dot"></span>ALBUM</div>
  </header>

  <div class="stage" id="stage">
    <!-- CINEMA SCREEN -->
    <div class="screen">
      <div class="visual" id="visual">
        <video id="video" playsinline webkit-playsinline x5-playsinline
          preload="auto" crossorigin="anonymous"
          controlslist="nodownload noplaybackrate"
          disablepictureinpicture></video>
        <div class="shade"></div>
        <div class="badge">HVL / NOW PLAYING</div>
        <div id="subFloat" class="sub-float"></div>
        <div class="loader"><div class="spinner"></div></div>
        <div class="buffer-bar"><div class="buffer-fill" id="bufferFill"></div></div>
      </div>

      <div class="bar">
        <input id="progress" class="progress" type="range" min="0" max="1000" value="0" aria-label="Progress">
        <div class="bar-row">
          <button class="vbtn mini-play" id="miniPlay" aria-label="Play">
            <svg viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z"/></svg>
          </button>
          <button class="vbtn" id="mute" aria-label="Mute">
            <svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6l-5 4H4z"/><path d="M17 9.5a4 4 0 0 1 0 5"/></svg>
          </button>
          <input id="volume" class="vol" type="range" min="0" max="1" step=".01" value=".9">
          <span id="videoTime" class="time">0:00 / 0:00</span>
          <span class="spacer"></span>
          <button class="vbtn" id="cc" aria-label="Lyrics" title="Lời bài hát">CC</button>
          <button class="vbtn" id="fullscreen" aria-label="Fullscreen">
            <svg viewBox="0 0 24 24"><path d="M8 4H4v4M16 4h4v4M20 16v4h-4M4 16v4h4"/></svg>
          </button>
        </div>
      </div>

      <div class="dock">
        <div class="now-info">
          <div id="title" class="now-title">Đang tải…</div>
          <div id="meta" class="now-meta">HVL Album</div>
        </div>
        <div class="transport">
          <button class="round" id="shuffle" aria-label="Shuffle">
            <svg viewBox="0 0 24 24"><path d="M3 7h3c4 0 6 10 10 10h5M18 14l3 3-3 3M3 17h3c2 0 3-2 4-3M15 7h1c2 0 3 3 5 3M18 4l3 3-3 3"/></svg>
          </button>
          <button class="round" id="prev" aria-label="Prev">
            <svg viewBox="0 0 24 24"><path d="M6 5v14M18 7l-8 5 8 5z"/></svg>
          </button>
          <button class="round play" id="play" aria-label="Play">
            <svg viewBox="0 0 24 24"><path d="M9 6.2v11.6L18.2 12 9 6.2z"/></svg>
          </button>
          <button class="round" id="next" aria-label="Next">
            <svg viewBox="0 0 24 24"><path d="M18 5v14M6 7l8 5-8 5z"/></svg>
          </button>
          <button class="round" id="repeat" aria-label="Repeat">
            <svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4M3 12a6 6 0 0 1 6-6h12M7 21l-4-4 4-4M21 12a6 6 0 0 1-6 6H3"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- LYRICS PANEL -->
    <aside class="lyrics-panel" id="lyricsPanel">
      <div class="lyrics-head">
        <div class="lyrics-title">Lời bài hát</div>
        <button class="lyrics-close" id="lyricsClose" aria-label="Đóng">✕</button>
      </div>
      <div class="lyrics-body" id="lyricsBody">
        <div class="lyric-empty">Bấm CC để xem lời · Thêm file .vtt vào thư mục subtitles/</div>
      </div>
    </aside>

    <!-- DESKTOP PLAYLIST -->
    <aside class="side-desktop">
      <div class="drawer-head">
        <div class="drawer-title">Playlist</div>
        <div id="countDesk" class="count">0</div>
      </div>
      <label class="search">⌕ <input id="searchDesk" placeholder="Tìm…" autocomplete="off"></label>
      <div id="playlistDesk" class="playlist"></div>
      <div id="statusDesk" class="status">…</div>
    </aside>
  </div>
</div>

<!-- MOBILE PLAYLIST DRAWER -->
<button class="drawer-toggle" id="drawerToggle" aria-label="Playlist">LIST</button>
<div class="drawer" id="drawer">
  <div class="drawer-bg" id="drawerBg"></div>
  <div class="drawer-sheet">
    <div class="drawer-handle"></div>
    <div class="drawer-head">
      <div class="drawer-title">Playlist</div>
      <div id="count" class="count">0 TRACKS</div>
    </div>
    <label class="search">⌕ <input id="search" placeholder="Tìm trong album…" autocomplete="off"></label>
    <div id="playlist" class="playlist"></div>
    <div id="status" class="status">Đang kết nối…</div>
  </div>
</div>

<script>
'use strict';
(function () {
  var WORKER = 'https://hvl-drive-stream.mhongphat.workers.dev';
  var SUB_BASE = './subtitles/';

  var video = document.getElementById('video');
  var visual = document.getElementById('visual');
  var stage = document.getElementById('stage');
  var playlistEl = document.getElementById('playlist');
  var playlistDesk = document.getElementById('playlistDesk');
  var statusEl = document.getElementById('status');
  var statusDesk = document.getElementById('statusDesk');
  var titleEl = document.getElementById('title');
  var metaEl = document.getElementById('meta');
  var countEl = document.getElementById('count');
  var countDesk = document.getElementById('countDesk');
  var progress = document.getElementById('progress');
  var volume = document.getElementById('volume');
  var videoTime = document.getElementById('videoTime');
  var subFloat = document.getElementById('subFloat');
  var bufferFill = document.getElementById('bufferFill');
  var lyricsBody = document.getElementById('lyricsBody');
  var lyricsPanel = document.getElementById('lyricsPanel');

  var tracks = [];
  var current = 0;
  var shuffle = false;
  var repeat = false;
  var userIntent = false;
  var retry = 0;
  var retryTimer = 0;
  var subtitleOn = false; // panel closed by default
  var cues = [];
  var cueRAF = 0;
  var loadToken = 0;
  var isSeeking = false;
  var nextVideo = null; // preloaded next track

  function status(t, error, ok) {
    var cls = 'status' + (error ? ' error' : ok ? ' ok' : '');
    statusEl.textContent = t;
    statusEl.className = cls;
    if (statusDesk) {
      statusDesk.textContent = t;
      statusDesk.className = cls;
    }
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmt(s) {
    return Number.isFinite(s) ? Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0') : '0:00';
  }
  function streamURL(id, nonce) {
    return WORKER + '/stream/' + encodeURIComponent(id) + (nonce ? '?r=' + nonce : '');
  }
  function isIOS() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }

  async function getJSON(url, timeout) {
    timeout = timeout || 20000;
    var c = new AbortController();
    var tm = setTimeout(function () { c.abort(); }, timeout);
    try {
      var r = await fetch(url, { cache: 'no-store', signal: c.signal, mode: 'cors' });
      var d = {};
      try { d = await r.json(); } catch (_) {}
      if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
      return d;
    } catch (e) {
      if (e.name === 'AbortError') throw new Error('Timeout');
      throw e;
    } finally {
      clearTimeout(tm);
    }
  }

  function setLoading(on) { visual.classList.toggle('loading', !!on); }

  function renderPlaylists() {
    var q1 = (document.getElementById('search').value || '').trim().toLocaleLowerCase('vi');
    var q2 = (document.getElementById('searchDesk') && document.getElementById('searchDesk').value || '').trim().toLocaleLowerCase('vi');
    function fill(el, q) {
      if (!el) return;
      el.innerHTML = '';
      tracks.forEach(function (t, i) {
        if (q && !t.name.toLocaleLowerCase('vi').includes(q)) return;
        var x = document.createElement('button');
        x.className = 'item' + (i === current ? ' active' : '');
        x.innerHTML = '<span class="num">' + String(i + 1).padStart(2, '0') + '</span><span class="song">' + esc(t.name.replace(/\.mp4$/i, '')) + '</span><span class="arrow">›</span>';
        x.onclick = function () {
          select(i, true);
          closeDrawer();
        };
        el.appendChild(x);
      });
    }
    fill(playlistEl, q1);
    fill(playlistDesk, q2);
    var label = tracks.length + ' TRACKS';
    countEl.textContent = label;
    if (countDesk) countDesk.textContent = label;
    metaEl.textContent = 'HVL · ' + (tracks.length ? current + 1 : 0) + ' / ' + tracks.length;
  }

  function subtitleURL(t) {
    return SUB_BASE + encodeURIComponent(t.name.replace(/\.[^/.]+$/, '') + '.vtt');
  }

  function parseVTT(text) {
    text = text.replace(/\r/g, '').replace(/^WEBVTT[^\n]*\n?/i, '');
    return text.split(/\n\s*\n/).map(function (b) {
      var a = b.split('\n');
      var i = a.findIndex(function (x) { return x.indexOf('-->') >= 0; });
      if (i < 0) return null;
      var m = a[i].match(/(?:(\d+):)?(\d{2}):(\d{2})[.,](\d{3})\s*-->\s*(?:(\d+):)?(\d{2}):(\d{2})[.,](\d{3})/);
      if (!m) return null;
      function sec(h, mi, s, ms) { return (+h || 0) * 3600 + (+mi) * 60 + (+s) + (+ms) / 1000; }
      return {
        start: sec(m[1], m[2], m[3], m[4]),
        end: sec(m[5], m[6], m[7], m[8]),
        text: a.slice(i + 1).join('\n').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '').trim()
      };
    }).filter(Boolean).sort(function (a, b) { return a.start - b.start; });
  }

  function renderLyricsPanel() {
    if (!cues.length) {
      lyricsBody.innerHTML = '<div class="lyric-empty">Chưa có lời cho bài này.<br>Thêm file <code>.vtt</code> vào thư mục <code>subtitles/</code></div>';
      return;
    }
    var html = '';
    cues.forEach(function (c, i) {
      html += '<div class="lyric-line" data-i="' + i + '" data-start="' + c.start + '">' + esc(c.text).replace(/\n/g, '<br>') + '</div>';
    });
    lyricsBody.innerHTML = html;
    lyricsBody.querySelectorAll('.lyric-line').forEach(function (el) {
      el.onclick = function () {
        var s = parseFloat(el.getAttribute('data-start'));
        if (Number.isFinite(s)) {
          video.currentTime = s;
          if (video.paused) { userIntent = true; playCurrent(); }
        }
      };
    });
  }

  async function loadSubs(t) {
    var token = ++loadToken;
    cues = [];
    subFloat.classList.remove('show');
    renderLyricsPanel();
    try {
      var r = await fetch(subtitleURL(t), { cache: 'no-store' });
      if (!r.ok) throw 0;
      var c = parseVTT(await r.text());
      if (token !== loadToken) return;
      cues = c;
      renderLyricsPanel();
      if (cues.length) startCues();
    } catch (_) {
      renderLyricsPanel();
    }
  }

  function startCues() {
    cancelAnimationFrame(cueRAF);
    var lastIdx = -1;
    function loop() {
      if (cues.length && !video.paused) {
        var t = video.currentTime;
        var found = null;
        var idx = -1;
        for (var i = cues.length - 1; i >= 0; i--) {
          if (t >= cues[i].start) {
            if (t <= cues[i].end) { found = cues[i]; idx = i; }
            else if (t < cues[i].end + 0.5) { idx = i; }
            break;
          }
        }
        // floating sub on video when panel closed
        if (!subtitleOn && found) {
          subFloat.innerHTML = esc(found.text).replace(/\n/g, '<br>');
          subFloat.classList.add('show');
        } else {
          subFloat.classList.remove('show');
        }
        // highlight + auto-scroll in panel
        if (subtitleOn && idx !== lastIdx && idx >= 0) {
          lastIdx = idx;
          var lines = lyricsBody.querySelectorAll('.lyric-line');
          lines.forEach(function (el, j) {
            el.classList.toggle('active', j === idx);
          });
          var active = lines[idx];
          if (active) {
            var bodyRect = lyricsBody.getBoundingClientRect();
            var lineRect = active.getBoundingClientRect();
            if (lineRect.top < bodyRect.top + 40 || lineRect.bottom > bodyRect.bottom - 40) {
              active.scrollIntoView({ block: 'center', behavior: 'smooth' });
            }
          }
        }
      }
      cueRAF = requestAnimationFrame(loop);
    }
    cueRAF = requestAnimationFrame(loop);
  }

  function chooseNext() {
    if (!tracks.length) return 0;
    if (shuffle && tracks.length > 1) {
      var n;
      do { n = Math.floor(Math.random() * tracks.length); } while (n === current);
      return n;
    }
    return (current + 1) % tracks.length;
  }

  function setSource(t, nonce) {
    video.pause();
    // Prefer using preloaded next if matches
    if (nextVideo && nextVideo.dataset.id === t.id && nextVideo.src) {
      video.src = nextVideo.src;
      nextVideo = null;
    } else {
      video.removeAttribute('src');
      video.load();
      video.src = streamURL(t.id, nonce || 0);
    }
    video.preload = 'auto';
    try { video.load(); } catch (_) {}
  }

  function preloadNext() {
    try {
      if (nextVideo) {
        nextVideo.src = '';
        nextVideo = null;
      }
      if (tracks.length < 2) return;
      var ni = chooseNext();
      if (ni === current) return;
      var t = tracks[ni];
      nextVideo = document.createElement('video');
      nextVideo.preload = 'auto';
      nextVideo.muted = true;
      nextVideo.playsInline = true;
      nextVideo.dataset.id = t.id;
      nextVideo.src = streamURL(t.id);
    } catch (_) {}
  }

  async function select(i, play) {
    if (!tracks.length) return;
    current = Math.max(0, Math.min(i, tracks.length - 1));
    var t = tracks[current];
    retry = 0;
    clearTimeout(retryTimer);
    titleEl.textContent = t.name.replace(/\.mp4$/i, '');
    renderPlaylists();
    loadSubs(t);
    setLoading(true);
    setSource(t);
    sync();
    status(play ? 'Đang mở…' : '✓ Sẵn sàng', false, true);
    if (play) {
      userIntent = true;
      await playCurrent();
    }
    setTimeout(preloadNext, 800);
  }

  function waitPlayable(ms) {
    ms = ms || (isIOS() ? 18000 : 14000);
    return new Promise(function (res, rej) {
      if (video.readyState >= 2) return res();
      var done = false;
      function ok() { if (done) return; done = true; clean(); res(); }
      function bad() { if (done) return; done = true; clean(); rej(new Error('MEDIA_ERROR')); }
      var tm = setTimeout(function () {
        if (done) return; done = true; clean();
        // iOS sometimes readyState stays low but can still play
        if (video.readyState >= 1) res();
        else rej(new Error('MEDIA_TIMEOUT'));
      }, ms);
      function clean() {
        clearTimeout(tm);
        video.removeEventListener('canplay', ok);
        video.removeEventListener('loadeddata', ok);
        video.removeEventListener('error', bad);
      }
      video.addEventListener('canplay', ok, { once: true });
      video.addEventListener('loadeddata', ok, { once: true });
      video.addEventListener('error', bad, { once: true });
    });
  }

  async function playCurrent() {
    if (!tracks.length) return false;
    userIntent = true;
    setLoading(true);
    try {
      var t = tracks[current];
      if (!video.src || !String(video.currentSrc || '').includes('/stream/')) setSource(t);
      // iOS: ensure not muted blocked
      video.setAttribute('playsinline', '');
      video.setAttribute('webkit-playsinline', '');
      if (video.readyState < 2) await waitPlayable();
      video.muted = false;
      video.volume = +volume.value || 0.9;
      var p = video.play();
      if (p) await p;
      retry = 0;
      setLoading(false);
      status('✓ Đang phát', false, true);
      sync();
      return true;
    } catch (e) {
      console.warn('play', e);
      setLoading(false);
      if (e.name === 'NotAllowedError') {
        status('⚠ Chạm nút Play để bắt đầu', true);
        return false;
      }
      if ((video.error && (video.error.code === 3 || video.error.code === 4)) || e.name === 'NotSupportedError') {
        status('❌ Video lỗi codec / stream', true);
        return false;
      }
      return recover();
    }
  }

  async function recover() {
    if (!userIntent || retry >= 3) { setLoading(false); return false; }
    var t = tracks[current];
    var keep = Number.isFinite(video.currentTime) ? video.currentTime : 0;
    var n = ++retry;
    status('Kết nối lại (' + n + '/3)…');
    setLoading(true);
    nextVideo = null;
    setSource(t, n);
    try {
      await waitPlayable();
      if (keep > 1 && Number.isFinite(video.duration) && keep < video.duration - 1) {
        try { video.currentTime = keep; } catch (_) {}
      }
      video.muted = false;
      video.volume = +volume.value || 0.9;
      await video.play();
      setLoading(false);
      status('✓ Đã kết nối lại', false, true);
      retry = 0;
      return true;
    } catch (e) {
      if (n < 3) {
        clearTimeout(retryTimer);
        retryTimer = setTimeout(recover, 900 * n);
      } else {
        setLoading(false);
        status('❌ Không mở được stream', true);
      }
      return false;
    }
  }

  function sync() {
    var playing = !video.paused;
    var iconPlay = '<svg viewBox="0 0 24 24"><path d="M9 6.2v11.6L18.2 12 9 6.2z"/></svg>';
    var iconPause = '<svg viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round"><path d="M8 6v12M16 6v12"/></svg>';
    document.getElementById('play').innerHTML = document.getElementById('miniPlay').innerHTML = playing ? iconPause : iconPlay;
  }

  function togglePlay() {
    if (video.paused) { userIntent = true; playCurrent(); }
    else { userIntent = false; video.pause(); sync(); }
  }
  function next() { if (tracks.length) select(chooseNext(), true); }
  function prev() {
    if (video.currentTime > 3) { video.currentTime = 0; return; }
    select((current - 1 + tracks.length) % tracks.length, true);
  }
  function setVolume(v) {
    v = Math.max(0, Math.min(1, +v));
    video.volume = v;
    video.muted = v === 0;
    volume.value = v;
    document.getElementById('mute').classList.toggle('active', v === 0);
  }

  function toggleLyrics() {
    subtitleOn = !subtitleOn;
    stage.classList.toggle('lyrics-open', subtitleOn);
    document.getElementById('cc').classList.toggle('active', subtitleOn);
    if (subtitleOn) {
      subFloat.classList.remove('show');
      startCues();
    }
  }

  function updateBuffer() {
    try {
      if (video.buffered.length && Number.isFinite(video.duration) && video.duration > 0) {
        var end = video.buffered.end(video.buffered.length - 1);
        bufferFill.style.width = Math.min(100, (end / video.duration) * 100) + '%';
      }
    } catch (_) {}
  }
  function update() {
    if (isSeeking) return;
    var d = video.duration;
    if (Number.isFinite(d) && d > 0) {
      var p = (video.currentTime / d) * 1000;
      progress.value = p;
      progress.style.setProperty('--p', (p / 10) + '%');
      videoTime.textContent = fmt(video.currentTime) + ' / ' + fmt(d);
    }
    updateBuffer();
  }

  /* Events */
  video.addEventListener('timeupdate', update);
  video.addEventListener('progress', updateBuffer);
  video.addEventListener('loadedmetadata', function () {
    update(); setLoading(false); status('✓ Sẵn sàng', false, true);
  });
  video.addEventListener('playing', function () {
    retry = 0; setLoading(false); status('✓ Đang phát', false, true); sync(); startCues();
  });
  video.addEventListener('pause', sync);
  video.addEventListener('waiting', function () {
    if (userIntent) { setLoading(true); status('Đang đệm…'); }
  });
  video.addEventListener('canplay', function () { setLoading(false); });
  video.addEventListener('stalled', function () { if (userIntent) recover(); });
  video.addEventListener('error', function () {
    if (!userIntent) return;
    var c = video.error && video.error.code;
    if (c === 3 || c === 4) status('❌ Lỗi video / stream', true);
    else recover();
  });
  video.addEventListener('ended', function () {
    if (repeat) { video.currentTime = 0; playCurrent(); }
    else next();
  });

  progress.addEventListener('input', function () {
    isSeeking = true;
    if (Number.isFinite(video.duration)) {
      var t = (+progress.value / 1000) * video.duration;
      progress.style.setProperty('--p', (progress.value / 10) + '%');
      videoTime.textContent = fmt(t) + ' / ' + fmt(video.duration);
    }
  });
  progress.addEventListener('change', function () {
    if (Number.isFinite(video.duration)) video.currentTime = (+progress.value / 1000) * video.duration;
    isSeeking = false;
  });
  // touch friendly seek
  progress.addEventListener('touchstart', function () { isSeeking = true; }, { passive: true });

  volume.addEventListener('input', function () { setVolume(volume.value); });
  volume.addEventListener('change', function () { video.dataset.prev = volume.value; });

  document.getElementById('mute').onclick = function () {
    setVolume(video.muted || video.volume === 0 ? +(video.dataset.prev || 0.9) : 0);
  };
  document.getElementById('play').onclick = togglePlay;
  document.getElementById('miniPlay').onclick = togglePlay;
  document.getElementById('next').onclick = next;
  document.getElementById('prev').onclick = prev;
  document.getElementById('shuffle').onclick = function () {
    shuffle = !shuffle;
    this.classList.toggle('active', shuffle);
  };
  document.getElementById('repeat').onclick = function () {
    repeat = !repeat;
    this.classList.toggle('active', repeat);
  };
  document.getElementById('cc').onclick = toggleLyrics;
  document.getElementById('lyricsClose').onclick = function () {
    if (subtitleOn) toggleLyrics();
  };
  document.getElementById('search').oninput = renderPlaylists;
  if (document.getElementById('searchDesk')) {
    document.getElementById('searchDesk').oninput = renderPlaylists;
  }

  document.getElementById('fullscreen').onclick = async function () {
    try {
      var el = visual;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (el.requestFullscreen) await el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
      } else {
        if (document.exitFullscreen) await document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    } catch (_) {
      try { video.webkitEnterFullscreen(); } catch (__) {}
    }
  };

  /* Drawer */
  function openDrawer() { document.getElementById('drawer').classList.add('open'); }
  function closeDrawer() { document.getElementById('drawer').classList.remove('open'); }
  document.getElementById('drawerToggle').onclick = openDrawer;
  document.getElementById('drawerBg').onclick = closeDrawer;

  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === ' ') { e.preventDefault(); togglePlay(); }
    else if (e.key === 'ArrowRight') video.currentTime = Math.min(video.duration || 0, video.currentTime + 5);
    else if (e.key === 'ArrowLeft') video.currentTime = Math.max(0, video.currentTime - 5);
    else if (e.key === 'ArrowUp') { e.preventDefault(); setVolume(Math.min(1, video.volume + 0.05)); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); setVolume(Math.max(0, video.volume - 0.05)); }
    else if (e.key === 'l' || e.key === 'L' || e.key === 'c' || e.key === 'C') toggleLyrics();
    else if (e.key === 'n' || e.key === 'N') next();
    else if (e.key === 'p' || e.key === 'P') prev();
    else if (e.key === 'f' || e.key === 'F') document.getElementById('fullscreen').click();
    else if (e.key === 'm' || e.key === 'M') document.getElementById('mute').click();
  });

  if ('mediaSession' in navigator) {
    try {
      navigator.mediaSession.setActionHandler('play', function () { userIntent = true; playCurrent(); });
      navigator.mediaSession.setActionHandler('pause', function () { userIntent = false; video.pause(); });
      navigator.mediaSession.setActionHandler('nexttrack', next);
      navigator.mediaSession.setActionHandler('previoustrack', prev);
    } catch (_) {}
  }

  // Unlock audio on first touch (iOS)
  function unlock() {
    try {
      var ctx = window.AudioContext || window.webkitAudioContext;
      if (ctx) {
        var ac = new ctx();
        if (ac.state === 'suspended') ac.resume();
      }
    } catch (_) {}
    document.removeEventListener('touchstart', unlock);
    document.removeEventListener('click', unlock);
  }
  document.addEventListener('touchstart', unlock, { once: true, passive: true });
  document.addEventListener('click', unlock, { once: true });

  async function init() {
    if (location.protocol === 'file:') {
      status('⚠ Dùng Live Server / GitHub Pages, không mở file://', true);
      return;
    }
    status('Đang tải playlist…');
    try {
      var d = await getJSON(WORKER + '/playlist', 20000);
      tracks = (d.files || []).filter(function (x) { return x.id && x.name; });
      if (!tracks.length) {
        status('❌ Không có video', true);
        return;
      }
      renderPlaylists();
      await select(0, false);
      status('✓ ' + tracks.length + ' bài · Ready', false, true);
    } catch (e) {
      console.error(e);
      status('❌ ' + ((e && e.message) || e), true);
    }
  }

  setVolume(0.9);
  init();
})();
</script>
</body>
</html>
